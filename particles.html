
<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <style>
        canvas {
            display: block;
            border-radius: 28px; 
            background: rgb(40, 109, 156);
            width: min(96vw, 96 vh); 
            height: min(96vw, 96vh);
            max-width: 800px;
            max-height: 800px; 
            cursor: crosshair; 
        }
    </style>
</head>

<body> 
    <canvas id="particleCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('particleCanvas'); 
            const context = canvas.getContext('2d');
            const GRAVITY = -0.02; // define const for gravity 


            const rand = (max, min) => Math.random() * (max-min) + min; 

            let particles = [];

            console.log(particles)


            function spawnParticle() {
                particles.push({
                    x,y,
                    vx,vy,
                    radius,
                    life: lifetime,
                    maxLife: lifetime, 
                })

            }

            function updateParticles() {
                for(let i = (particles.length-1); i >=0; i--) {
                    const p = particles[i] // get particle for each entry in array 
                    p.vy += GRAVITY // apply gravity to y velocity of P 

                    p.x += p.vx; // original p x position + velocity of x
                    p.y += p.vy; 

                    p.vx *= 0.998; // slow down velocity slightly proportional  
                    p.vy *= 0.998; 
                    p.life--; 

                    if(p.life <= 0)  { // destroy particle if no life or if it leaves the canvas
                        particles.splice(i,1); 
                    }
                }
            }

            function draw() {
                context.clearRect(0,0,canvas.width, canvas.height) 
            }

            function loop() {
                for (let s = 0; s < 8; s++) { // spawn some functions every frame
                    if(particles.length < 2000){ // make sure not to spawn infinate particles 
                        spawnParticle(); 
                    }
                    else {
                        break; 
                    }
                }
                updateParticles(); 
                draw(); 
                requestAnimationFrame(loop);
            }

            loop()
             
        })(); // tells it to run the function we defined 
    </script>
</html>
