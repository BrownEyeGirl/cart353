
<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <style>
        canvas {
            display: block;
            border-radius: 28px; 
            background: rgb(40, 109, 156);
            width: min(96vw, 96 vh); 
            height: min(96vw, 96vh);
            max-width: 800px;
            max-height: 800px; 
            cursor: crosshair; 
        }
    </style>
</head>

<body> 
    <canvas style="background-color: blue;" id="particleCanvas" width="800" height="800"></canvas>></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('particleCanvas'); 
            const context = canvas.getContext('2d');
            const GRAVITY = -0.02; // define const for gravity 

            const rand = (max, min) => Math.random() * (max-min) + min; 

            let particles = [];

            console.log(particles)


            function spawnParticle() {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: Math.random() * 2 - 1,
                    vy: Math.random() * 2 - 1,
                    radius: 3,
                    life: 1000,
                    maxLife: 1000
                });
            }

            function updateParticles() {
                /** BOIDS: each particle checks nearby particles and adjusts velocity using: 
                 * Separation = avoid neighbors 
                 * Alignment = match neighbor direction 
                 * Cohesion = move toward neighbors
                */
                for(let i = (particles.length-1); i >=0; i--) {
                    const p = particles[i] // get particle for each entry in array 
                    p.vy += GRAVITY // apply gravity to y velocity of P 

                    p.x += p.vx; // original p x position + velocity of x
                    p.y += p.vy; 

                    p.vx *= 0.998; // slow down velocity slightly proportional  
                    p.vy *= 0.998; 
                    p.life--; 

                    if(p.life <= 0)  { // destroy particle if no life or if it leaves the canvas
                        particles.splice(i,1); 
                    }
                }
            }
            
   
            function draw() {
                context.clearRect(0,0,canvas.width, canvas.height) 
            }

            function resetParticles() {
                                    console.log("particles reset")

                for (let p of particles) {
                    p.x = Math.random() * canvas.width;
                    p.y = Math.random() * canvas.height;

                    p.vx = Math.random() * 2 - 1;
                    p.vy = Math.random() * 2 - 1;
                    console.log("particles reset")
                }
            }

            canvas.addEventListener("click", resetParticles);


            function loop() {
                for (let s = 0; s < 8; s++) { // spawn some functions every frame
                    if(particles.length < 2000){ // make sure not to spawn infinate particles 
                        spawnParticle(); 
                    }
                    else {
                        break; 
                    }
                }
                updateParticles(); 
                draw(); 
                requestAnimationFrame(loop);
            }

            loop()
             
        })(); // tells it to run the function we defined 
    </script>
</html>
